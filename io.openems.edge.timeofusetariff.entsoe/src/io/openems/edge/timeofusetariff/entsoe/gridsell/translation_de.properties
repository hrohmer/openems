unableToFetchMarketPrices = Der externe Preisdienst ist vorübergehend nicht erreichbar. Die Preise werden automatisch aktualisiert, sobald der Dienst wieder verfügbar ist.
unableToFetchIntradayMarketPrices = Der externe Intraday-Preisdienst ist vorübergehend nicht erreichbar. Die Intraday-Preise werden automatisch aktualisiert, sobald der Dienst wieder verfügbar ist.