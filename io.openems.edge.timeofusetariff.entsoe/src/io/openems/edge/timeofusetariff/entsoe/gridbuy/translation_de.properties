unableToUpdatePrices = Der externe Preisdienst (ENTSO-E API) ist vorübergehend nicht erreichbar. Die Preise werden automatisch aktualisiert, sobald der Dienst wieder verfügbar ist.
unableToUpdateIntradayPrices = Der externe Intraday-Preisdienst (ENTSO-E API) ist vorübergehend nicht erreichbar. Die Intraday-Preise werden automatisch aktualisiert, sobald der Dienst wieder verfügbar ist.
